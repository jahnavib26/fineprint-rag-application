# Questions the lease genuinely answers. Ground truth comes from
# scripts/lease_content.py, which also generates the PDFs, so the expected
# citations are exact rather than hand-labelled.
#
# `must_cite` is the clause a correct answer has to cite. A right-sounding
# answer citing the wrong clause is a failure here, because a tenant clicking
# the citation would land somewhere that doesn't say what the answer claimed.

- id: maple-sublet-shortterm
  lease_id: maple-court
  question: Can I list my apartment on Airbnb for a weekend?
  expect: answered
  must_cite: ["14(b)"]
  category: subletting
  note: >-
    The clause never says "Airbnb" — it says "any hosting platform" and
    "less than thirty (30) days". Pure vocabulary overlap cannot find this.

