services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: fineprint
      POSTGRES_PASSWORD: fineprint
      POSTGRES_DB: fineprint
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fineprint"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The deployable image, running the same way it will in production. Not
  # started by default — `docker compose up -d` brings up only the database
  # for local development against a hot-reloading uvicorn.
  #
  #   docker compose --profile app up --build
  #
  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8000"
    environment:
      # Inside the compose network the database is `db:5432`, not the host port.
      DATABASE_URL: postgresql+asyncpg://fineprint:fineprint@db:5432/fineprint
      # Passed through when set on the host; absent keys fall back to the
      # offline providers rather than failing to boot.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
