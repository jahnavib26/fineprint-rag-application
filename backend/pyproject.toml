[project]
name = "fineprint"
version = "0.1.0"
description = "Lease-aware RAG: clause-tree ingestion, amendment-aware retrieval, grounded answers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "pydantic-settings>=2.4",
    "pymupdf>=1.24",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "langgraph>=0.2",
]

[project.optional-dependencies]
# Providers are optional extras: install only the vendors you actually use.
# With none installed, FinePrint runs on the offline providers.
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
gemini = ["google-genai>=1.0"]
voyage = ["voyageai>=0.3"]
all-providers = [
    "anthropic>=0.40",
    "openai>=1.50",
    "google-genai>=1.0",
    "voyageai>=0.3",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "reportlab>=4.2",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Depends()/File()/Form() in argument defaults is how FastAPI declares
# dependencies; B008 is a false positive against that idiom.
"app/api/*.py" = ["B008"]
